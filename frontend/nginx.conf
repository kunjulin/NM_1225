# NM Medication Stewardship Frontend Nginx 設定
# 核醫藥物管理系統前端 Nginx 配置
# 支援 /fhir 子路徑部署

server {
    listen 80;
    server_name localhost;

    # 根目錄指向建構輸出
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API 反向代理到 Backend（支援 /fhir/api 路徑）
    location /fhir/api {
        # 移除 /fhir 前綴，保留 /api
        rewrite ^/fhir(/api.*)$ $1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 靜態資源快取（支援 /fhir 路徑）
    location ~* ^/fhir/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 移除 /fhir 前綴來找到實際檔案
        rewrite ^/fhir/(.*)$ /$1 break;
    }

    # SPA fallback - /fhir 路徑下所有路由導向 index.html
    location /fhir {
        # 嘗試找檔案，找不到則返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # 根路徑重定向到 /fhir
    location = / {
        return 301 /fhir;
    }

    # 健康檢查端點
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}


