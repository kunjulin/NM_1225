# NM Medication Stewardship - Rules Configuration
# 核子醫學放射藥物用藥規則配置
# 參考：2024 UPDATE OF THE NORTH AMERICAN CONSENSUS GUIDELINES FOR PEDIATRIC ADMINISTERED RADIOPHARMACEUTICAL ACTIVITIES

# 預設給藥途徑（所有核醫檢查預設為靜脈注射）
default_route:
  system: "http://snomed.info/sct"
  code: "47625008"
  display: "Intravenous route"

exams:
  BONE_SCAN:
    name: 骨骼掃描
    radiopharmaceutical: Tc-99m-MDP
    dose_range: [555, 925]  # MBq (成人範圍)
    required_facts:
      - weight
    notes: 標準成人劑量 740 MBq
    route:
      system: "http://snomed.info/sct"
      code: "47625008"
      display: "Intravenous route"
    na2024:
      # 99mTc-MDP 依據 NA-2024 指引
      activity_per_kg: 9.3       # MBq/kg (0.25 mCi/kg) - 低端
      activity_per_kg_high: 9.3  # MBq/kg - 高端 (單一劑量建議)
      min_activity: 37           # MBq (1.0 mCi)
      max_activity: 740          # MBq (20 mCi)
  
  MAG3:
    name: 腎功能掃描
    radiopharmaceutical: Tc-99m-MAG3
    dose_range: [37, 148]  # MBq
    required_facts:
      - weight
      - renal
    notes: 需考慮腎功能
    route:
      system: "http://snomed.info/sct"
      code: "47625008"
      display: "Intravenous route"
    na2024:
      # 99mTc-MAG3 依據 NA-2024 指引
      activity_per_kg: 3.7       # MBq/kg (0.10 mCi/kg) - 不含 flow study
      activity_per_kg_high: 5.55 # MBq/kg (0.15 mCi/kg) - 含 flow study 為高端
      min_activity: 37           # MBq (1.0 mCi)
      max_activity: 148          # MBq (4.0 mCi)
  
  DMSA:
    name: 腎臟皮質掃描
    radiopharmaceutical: Tc-99m-DMSA
    dose_range: [18.5, 100]  # MBq
    required_facts:
      - weight
    notes: 兒童常見檢查
    route:
      system: "http://snomed.info/sct"
      code: "47625008"
      display: "Intravenous route"
    na2024:
      # 99mTc-DMSA 依據 NA-2024 指引
      activity_per_kg: 1.85      # MBq/kg (0.05 mCi/kg) - 低端
      activity_per_kg_high: 1.85 # MBq/kg - 高端 (單一劑量建議)
      min_activity: 18.5         # MBq (0.5 mCi)
      max_activity: 100          # MBq (2.7 mCi)
  
  MIBG:
    name: MIBG 掃描
    radiopharmaceutical: I-123-MIBG
    dose_range: [37, 370]  # MBq
    required_facts:
      - weight
    notes: 神經內分泌腫瘤診斷
    route:
      system: "http://snomed.info/sct"
      code: "47625008"
      display: "Intravenous route"
    na2024:
      # 123I-MIBG 依據 NA-2024 指引
      activity_per_kg: 5.2       # MBq/kg (0.14 mCi/kg) - 低端
      activity_per_kg_high: 5.2  # MBq/kg - 高端 (單一劑量建議)
      min_activity: 37           # MBq (1.0 mCi)
      max_activity: 370          # MBq (10.0 mCi)
  
  FDG_PET:
    name: 葡萄糖正子造影
    radiopharmaceutical: F18-FDG
    dose_range: [26, 370]  # MBq
    required_facts:
      - weight
    notes: 標準成人劑量 370 MBq
    route:
      system: "http://snomed.info/sct"
      code: "47625008"
      display: "Intravenous route"
    na2024:
      # 18F-FDG 依據 NA-2024 指引 (Body imaging)
      activity_per_kg: 2.96     # MBq/kg (0.08 mCi/kg) - 低端
      activity_per_kg_high: 5.2 # MBq/kg (0.14 mCi/kg) - 高端
      min_activity: 26          # MBq (0.7 mCi)
      max_activity: 370         # MBq (10 mCi)
      adult_standard: 370       # MBq
      # Brain imaging 使用較低劑量
      brain_activity_per_kg: 1.85  # MBq/kg
      brain_min: 14                # MBq
      brain_max: 148               # MBq
  
  DTPA:
    name: 腎絲球過濾率掃描
    radiopharmaceutical: Tc-99m-DTPA
    dose_range: [185, 370]  # MBq (成人)
    required_facts:
      - weight
      - renal
    notes: GFR 測量
    route:
      system: "http://snomed.info/sct"
      code: "47625008"
      display: "Intravenous route"
    na2024:
      # 99mTc-DTPA 使用類似 MAG3 的劑量原則
      activity_per_kg: 3.7       # MBq/kg - 低端
      activity_per_kg_high: 3.7  # MBq/kg - 高端 (單一劑量建議)
      min_activity: 37           # MBq
      max_activity: 370          # MBq

  NaF_PET:
    name: 氟化鈉正子造影
    radiopharmaceutical: F18-NaF
    dose_range: [18.5, 148]  # MBq
    required_facts:
      - weight
    notes: 骨骼 PET/CT
    route:
      system: "http://snomed.info/sct"
      code: "47625008"
      display: "Intravenous route"
    na2024:
      # 18F-sodium fluoride 依據 NA-2024 指引
      activity_per_kg: 1.85      # MBq/kg (0.05 mCi/kg) - 低端
      activity_per_kg_high: 1.85 # MBq/kg - 高端 (單一劑量建議)
      min_activity: 18.5         # MBq (0.5 mCi)
      max_activity: 148          # MBq (4 mCi)

  DOTATATE:
    name: DOTATATE PET
    radiopharmaceutical: Ga-68-DOTATATE
    dose_range: [14, 200]  # MBq
    required_facts:
      - weight
    notes: 神經內分泌腫瘤 PET
    route:
      system: "http://snomed.info/sct"
      code: "47625008"
      display: "Intravenous route"
    na2024:
      # 68Ga-DOTATATE 依據 NA-2024 指引
      activity_per_kg: 2.0       # MBq/kg (0.054 mCi/kg) - 低端
      activity_per_kg_high: 2.0  # MBq/kg - 高端 (單一劑量建議)
      min_activity: 14           # MBq (0.38 mCi)
      max_activity: 200          # MBq (5.4 mCi)

batch_policy:
  # 批次核准政策
  allow_warn_flags: true
  max_warn_count: 2
  require_weight: true
  require_renal_for_exams:
    - MAG3
    - DTPA

# NA-2024 劑量計算說明
# 計算公式:
#   - 建議劑量 = 體重(kg) × activity_per_kg (低端係數)
#   - 最大劑量 = min(體重(kg) × activity_per_kg_high, max_activity)
#   - 最小劑量 = min_activity
#
# 範例 (80kg FDG_PET):
#   - 建議劑量: 80 × 2.96 = 236.8 MBq
#   - 最大劑量: min(80 × 5.2, 370) = min(416, 370) = 370 MBq
#   - 範圍: 26-370 MBq
#
# 兒童 (體重 < 70kg) 使用相同公式計算
